<header class="site-header" id="site-header">
  <div class="header-container">
    <a href="{{ '/' | relative_url }}" class="brand-logo">
      <span class="logo-avatar">BS</span>
      <span class="logo-text">Bharath<span class="accent-text">.dev</span></span>
    </a>

    <nav class="desktop-nav" id="desktop-nav">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
        <li><a href="{{ '/projects.html' | relative_url }}" class="nav-link {% if page.url contains 'projects' %}active{% endif %}">Projects</a></li>
        <li><a href="{{ '/about.html' | relative_url }}" class="nav-link {% if page.url contains 'about' %}active{% endif %}">About</a></li>
        <li><a href="{{ '/#blog' | relative_url }}" class="nav-link">Articles</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle mobile menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer" id="mobile-drawer">
    <ul class="mobile-nav-links">
      <li><a href="{{ '/' | relative_url }}" class="mobile-nav-link">Home</a></li>
      <li><a href="{{ '/projects.html' | relative_url }}" class="mobile-nav-link">Projects</a></li>
      <li><a href="{{ '/about.html' | relative_url }}" class="mobile-nav-link">About</a></li>
      <li><a href="{{ '/#blog' | relative_url }}" class="mobile-nav-link">Articles</a></li>
    </ul>
  </div>
</header>
